<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daily" />
<title>Daily</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:#111111; --paper:#ffffff; --muted:#9a9a9a; --faint:#d8d8d8;
    --hover:#f7f7f7; --band:#f2f2f2; --divider:#e4e4e4;
  }
  html[data-theme="dark"]{
    --ink:#ffffff; --paper:#111111; --muted:#8a8a8a; --faint:#3a3a3a;
    --hover:#1c1c1c; --band:#1c1c1c; --divider:#2a2a2a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #root{ max-width:420px; margin:0 auto; padding:36px 22px 90px; min-height:100vh; }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 11px; border-radius:12px; cursor:pointer; }
  .theme-toggle:hover{ background:var(--hover); }

  .tabs{ display:flex; gap:20px; margin-bottom:22px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.05em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); }

  .date-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:26px; letter-spacing:-0.01em; margin:0 0 4px; }
  .frac{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .mini-balance{ font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--muted); margin-bottom:20px; }

  .list{ list-style:none; margin:0 0 4px; padding:0; }
  .item{ display:flex; align-items:center; gap:10px; padding:13px 2px; border-bottom:1px solid var(--divider); }
  .item-icon{ flex:none; width:18px; height:18px; color:var(--ink); }
  .item-icon svg{ width:100%; height:100%; }
  
  /* Type Pill Styling Update */
  .type-pill{
    flex:none; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:12px; border:1.5px solid var(--ink); white-space:nowrap;
    display:inline-flex; align-items:center; gap:3px;
  }
  .type-pill.charging{ background:var(--ink); color:var(--paper); }
  .type-pill.plan{ background:transparent; color:var(--ink); }

  .item-text{ flex:1; font-size:15.5px; line-height:1.4; word-break:break-word; }
  .del-btn{ flex:none; width:20px; height:20px; border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer; line-height:1; }
  .del-btn:hover{ color:var(--ink); }

  .item-empty{ padding:26px 2px; color:var(--muted); font-size:14px; text-align:center; }

  .add-block{ margin-top:18px; padding-top:18px; border-top:1px solid var(--ink); }
  .picker-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .cat-pill{ border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:700; padding:6px 14px; border-radius:14px; cursor:pointer; white-space:nowrap; }
  .cat-pill.active{ background:var(--ink); color:var(--paper); }
  .type-picker{ display:flex; gap:8px; margin-bottom:16px; }

  .icon-picker{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .icon-pill{
    flex:none; width:32px; height:32px; border:1.2px solid var(--ink); background:var(--paper); border-radius:7px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:7px; color:var(--ink);
  }
  .icon-pill svg{ width:100%; height:100%; }
  .icon-pill.active{ background:var(--ink); color:var(--paper); }

  .add-row{ display:flex; align-items:center; gap:10px; }
  .add-icon-preview{ flex:none; width:17px; height:17px; color:var(--ink); }
  .add-icon-preview svg{ width:100%; height:100%; }
  .add-input{ flex:1; border:none; outline:none; font-family:'Inter', sans-serif; font-size:15px; background:transparent; color:var(--ink); border-bottom:1.3px solid var(--ink); padding-bottom:6px; }
  .add-input::placeholder{ color:var(--muted); }
  .add-submit-btn{ flex:none; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:9px 16px; border-radius:16px; cursor:pointer; }
  .add-submit-btn:hover{ opacity:0.85; }
  .add-submit-btn[disabled]{ opacity:0.5; cursor:default; }

  .balance-banner{ border:1px solid var(--ink); border-radius:10px; padding:18px; margin-bottom:20px; }
  .balance-banner .label{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .balance-banner .value{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:40px; letter-spacing:-0.01em; }
  .balance-banner .note{ font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5; }

  /* Monthly Summary Box */
  .monthly-summary-box{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;
    border:1px solid var(--ink); border-radius:10px; padding:14px 10px; margin-bottom:18px;
    text-align:center; background:var(--hover);
  }
  .monthly-stat-item .m-label{ display:block; font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; }
  .monthly-stat-item .m-val{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; }

  .section-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .month-nav-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }
  .nav-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:4px 9px; border-radius:3px; cursor:pointer; }

  .month-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .month-weekday-cell{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--muted); }
  .month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .month-cell{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; }
  .month-daynum{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted); }
  .month-dot{ width:8px; height:8px; border-radius:50%; border:1.2px solid var(--faint); }
  .month-dot.positive{ background:var(--ink); border-color:var(--ink); }
  .month-dot.negative{ background:transparent; border-color:var(--ink); }
  .month-cell.today .month-daynum{ color:var(--ink); font-weight:700; }

  /* Focus character */
  .focus-char{ width:96px; height:96px; margin:0 auto 10px; }
  .focus-char.shake{ animation: charShake 0.4s ease; }
  @keyframes charShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .focus-char-inner{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    animation: charBob 2.4s ease-in-out infinite; transform-box: fill-box; color:var(--ink);
  }
  @keyframes charBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .focus-char-inner svg{ width:100%; height:100%; overflow:visible; }
  #focus-char-pose{ display:block; width:100%; height:100%; }
  .focus-char-eye{ animation: charBlink 4.5s infinite; transform-origin:center; transform-box: fill-box; }
  @keyframes charBlink{ 0%,92%,100%{ transform:scaleY(1);} 96%{ transform:scaleY(0.1);} }

  .char-upload-row{ text-align:center; margin-bottom:14px; display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .char-slot-col{ display:flex; align-items:center; }

  .focus-video-wrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid var(--ink); background:#000; margin-bottom:14px; }
  #focus-video{ width:100%; display:block; aspect-ratio:4/3; object-fit:cover; transition:filter 0.2s ease; }
  #focus-video.blurred{ filter: blur(22px) saturate(0.8); }
  .blur-toggle-btn{
    position:absolute; bottom:8px; right:8px; border:1px solid var(--paper); background:rgba(0,0,0,0.55);
    color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 10px;
    border-radius:12px; cursor:pointer;
  }
  .focus-stat-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; }
  .focus-timer{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:32px; letter-spacing:-0.01em; }
  .focus-substat{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); text-align:right; line-height:1.6; }
  .focus-feedback{ margin-top:12px; padding:12px 14px; border:1px solid var(--ink); border-radius:8px; font-size:13.5px; line-height:1.5; min-height:20px; }
  .focus-summary-card{ border:1px solid var(--ink); border-radius:10px; padding:18px; }
  .focus-summary-big{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; margin-bottom:6px; }
  .dur-picker{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .dur-pill{ border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:6px 11px; border-radius:14px; cursor:pointer; white-space:nowrap; }
  .dur-pill.active{ background:var(--ink); color:var(--paper); }
  .reminder-btn{ border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:7px 10px; border-radius:5px; cursor:pointer; flex:none; }
  .reminder-btn.off{ background:var(--paper); color:var(--ink); }
  .reminder-sub{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; text-align:center; }
  .quote-add-link{ background:none; border:none; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:2px; }

  .status{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); text-align:center; padding:60px 0; }
</style>
</head>
<body>
<div id="root"><div class="status">Loading…</div></div>

<script>
(function(){
  const STORAGE_KEY = 'daily-app-data-v3';
  const root = document.getElementById('root');
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAY_NAMES_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const ICON_DEFS = {
    run:    '<rect x="1.5" y="10" width="3" height="4" rx="1" fill="currentColor"/><rect x="19.5" y="10" width="3" height="4" rx="1" fill="currentColor"/><rect x="4.8" y="9" width="2.6" height="6" rx="1" fill="currentColor"/><rect x="16.6" y="9" width="2.6" height="6" rx="1" fill="currentColor"/><rect x="7.4" y="11" width="9.2" height="2" fill="currentColor"/>',
    book:   '<path d="M4 5c2-1 5-1 7 0v14c-2-1-5-1-7 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M20 5c-2-1-5-1-7 0v14c2-1 5-1 7 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    cook:   '<path d="M4 11h16v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="currentColor"/><rect x="9" y="8.5" width="6" height="2" rx="1" fill="currentColor"/><path d="M9 6c0-1 1-1 1-2M15 6c0-1-1-1-1-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
    music:  '<path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/>',
    sleep:  '<path d="M3 18v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 14h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="4" height="3" rx="1" fill="currentColor"/><line x1="3" y1="18" x2="3" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="18" x2="21" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    brief:  '<rect x="3" y="8" width="18" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8V6.3A1.8 1.8 0 0 1 10.8 4.5h2.4A1.8 1.8 0 0 1 15 6.3V8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    brush:  '<path d="M4 20l4-1 10.5-10.5-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M14.5 6.5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    broom:  '<line x1="16" y1="3" x2="8" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 14l-4 7h3l2 -3 2 3h3z" fill="currentColor"/>',
    pill:   '<rect x="4" y="9.5" width="16" height="6.5" rx="3.25" transform="rotate(-35 12 12.75)" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="9.5" x2="12" y2="16" transform="rotate(-35 12 12.75)" stroke="currentColor" stroke-width="2"/>',
    pencil: '<path d="M4 20l1-4.2L15.3 5.4l2.9 2.9L7.9 18.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M13.6 7.1l2.9 2.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    coffee: '<path d="M5 10h12v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M17 11.5h1.3a2.3 2.3 0 0 1 0 4.6H17" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7c0-1 1-1 1-2M12 7c0-1 1-1 1-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    alarm:  '<circle cx="12" cy="13.5" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9.5v4l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.2 6l2.3 2M18.8 6l-2.3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
  };
  const ICON_KEYS = Object.keys(ICON_DEFS);
  const ICON_LABELS = {
    run:'Exercise', book:'Study', cook:'Cooking', music:'Music', sleep:'Sleep',
    brief:'Work', brush:'Hobby', broom:'Chores', pill:'Medicine', pencil:'Journal',
    coffee:'Break', alarm:'Wake up'
  };
  function iconMarkup(key){
    const inner = ICON_DEFS[key] || ICON_DEFS.run;
    return `<svg viewBox="0 0 24 24">${inner}</svg>`;
  }

  function dkeyFromDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dkeyFromDate(new Date()); }
  function todayLabel(){
    const d = new Date();
    return `${DAY_NAMES_SHORT[d.getDay()]}, ${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
  function formatMMSS(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage;
  async function storageGet(key){
    if(hasClaudeStorage){
      try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
      catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(hasClaudeStorage){
      try{ await window.storage.set(key, value, false); }catch(e){ console.error('Save failed', e); }
      return;
    }
    try{ localStorage.setItem(key, value); }catch(e){ console.error('Save failed', e); }
  }

  let data = { items: [], voiceClips: {} };
  let theme = 'light';
  let activeTab = 'today';
  let newItemIcon = ICON_KEYS[0];
  let newItemType = 'plan';
  let newItemText = '';
  let progressMonth = new Date(); progressMonth.setDate(1);

  // ---- Focus session state ----
  let focusActive = false;
  let focusStream = null;
  let focusModel = null;
  let focusModelLoading = false;
  let focusDurationMin = 30;
  let focusLogIcon = null;
  let focusLogType = 'plan';
  let focusElapsedSec = 0;
  let focusedSec = 0;
  let foulCount = 0;
  let consecutiveMissing = 0;
  let focusTimerInterval = null;
  let focusFeedbackLine = '';
  let focusSessionSummary = null;
  let voiceOn = true;
  let blurCamera = true;
  let koreanVoice = null;
  let voiceUnlocked = false;

  const FOCUS_LINES_OK = ['좋아, 지금 아주 잘하고 있어.', '이대로 쭉 가자.', '집중력 좋은데?', '흐트러지지 마.'];
  const FOCUS_LINES_FOUL = ['어디 갔었어? 집중해!', '화면으로 다시 와.', '방금 딴 데 봤지?', '자리 비우지 마.'];

  function loadKoreanVoice(){
    if(!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    koreanVoice = voices.find(v => v.lang && v.lang.startsWith('ko')) || null;
  }
  if('speechSynthesis' in window){
    loadKoreanVoice();
    window.speechSynthesis.onvoiceschanged = loadKoreanVoice;
  }
  function unlockVoice(){
    if(voiceUnlocked) return;
    voiceUnlocked = true;
    try{
      if('speechSynthesis' in window){
        const primer = new SpeechSynthesisUtterance(' ');
        primer.volume = 0;
        window.speechSynthesis.speak(primer);
      }
      const primerAudio = new Audio();
      primerAudio.play().catch(()=>{});
    }catch(e){}
  }
  function speakTTS(text){
    if(!('speechSynthesis' in window) || !text) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      if(koreanVoice) utter.voice = koreanVoice;
      utter.pitch = 0.8;
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }catch(e){}
  }
  function speakLine(category, text){
    if(!voiceOn) return;
    const clip = data.voiceClips && data.voiceClips[category];
    if(clip){
      try{
        const audio = new Audio(clip);
        audio.play().catch(() => speakTTS(text));
        return;
      }catch(e){}
    }
    speakTTS(text);
  }

  function applyTheme(){
    if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
  }

  function todayItems(){ return data.items.filter(it => it.date === todayKey()); }

  function totalBalance(){
    let balance = 0, healDone = 0, planDone = 0;
    data.items.forEach(it => {
      if(it.type === 'heal'){ balance += 1; healDone += 1; }
      else { balance -= 1; planDone += 1; }
    });
    return { balance, healDone, planDone };
  }

  function monthlyStats(targetMonth){
    const year = targetMonth.getFullYear();
    const month = targetMonth.getMonth();
    let chargingCount = 0;
    let planCount = 0;

    data.items.forEach(it => {
      if(!it.date) return;
      const parts = it.date.split('-');
      if(parts.length === 3){
        const itemYear = parseInt(parts[0], 10);
        const itemMonth = parseInt(parts[1], 10) - 1;
        if(itemYear === year && itemMonth === month){
          if(it.type === 'heal') chargingCount++;
          else planCount++;
        }
      }
    });
    return { chargingCount, planCount, net: chargingCount - planCount };
  }

  async function load(){
    try{
      const raw = await storageGet(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : { items: [], voiceClips: {} };
    }catch(e){ data = { items: [], voiceClips: {} }; }
    if(!data.items) data.items = [];
    if(!data.voiceClips) data.voiceClips = {};

    theme = (await storageGet('daily-theme-pref')) === 'dark' ? 'dark' : 'light';
    voiceOn = (await storageGet('daily-voice-pref')) !== 'off';
    blurCamera = (await storageGet('daily-blur-pref')) !== 'off';
    render();
  }

  async function save(){ await storageSet(STORAGE_KEY, JSON.stringify(data)); }

  function typePillMarkup(type){
    if(type === 'heal'){
      return `<span class="type-pill charging">+1 Charging</span>`;
    }
    return `<span class="type-pill plan">−1 Plan</span>`;
  }

  function renderTodayTab(){
    const items = todayItems();
    const { balance } = totalBalance();

    const listHtml = items.length
      ? items.map(it => `
          <li class="item" data-id="${it.id}">
            <span class="item-icon">${iconMarkup(it.icon)}</span>
            ${typePillMarkup(it.type)}
            <span class="item-text">${escapeHtml(it.text)}</span>
            <button class="del-btn" data-action="delete" data-id="${it.id}">×</button>
          </li>`).join('')
      : `<li class="item-empty">Nothing logged yet today. Add something below.</li>`;

    const typePickerHtml = `
      <button class="cat-pill${newItemType==='plan'?' active':''}" data-itemtype="plan">−1 Plan</button>
      <button class="cat-pill${newItemType==='heal'?' active':''}" data-itemtype="heal">+1 Charging</button>`;

    const iconPickerHtml = ICON_KEYS.map(key => `
      <button class="icon-pill${key===newItemIcon?' active':''}" data-iconkey="${key}">${iconMarkup(key)}</button>
    `).join('');

    return `
      <h1 class="date-title">${todayLabel()}</h1>
      <p class="frac">${items.length} logged today</p>
      <p class="mini-balance">Balance: ${balance >= 0 ? '+' : ''}${balance}</p>
      <ul class="list">${listHtml}</ul>
      <div class="add-block">
        <div class="picker-label">Type</div>
        <div class="type-picker">${typePickerHtml}</div>
        <div class="picker-label">Icon</div>
        <div class="icon-picker">${iconPickerHtml}</div>
        <div class="add-row">
          <span class="add-icon-preview">${iconMarkup(newItemIcon)}</span>
          <input class="add-input" id="add-input" type="text" placeholder="Name (optional)" value="${escapeHtml(newItemText)}" />
          <button class="add-submit-btn" id="add-btn">Add</button>
        </div>
      </div>
    `;
  }

  function renderProgressTab(){
    const { balance, healDone, planDone } = totalBalance();
    const mStats = monthlyStats(progressMonth);
    const monthName = MONTHS_FULL[progressMonth.getMonth()];
    const year = progressMonth.getFullYear();

    const yearNum = progressMonth.getFullYear(), monthNum = progressMonth.getMonth();
    const firstDay = new Date(yearNum, monthNum, 1);
    const daysInMonth = new Date(yearNum, monthNum+1, 0).getDate();
    const startWeekday = firstDay.getDay();
    const todayStr = todayKey();

    let cellsHtml = '';
    for(let i = 0; i < startWeekday; i++){ cellsHtml += `<div class="month-cell"></div>`; }
    for(let d = 1; d <= daysInMonth; d++){
      const cellDate = new Date(yearNum, monthNum, d);
      const key = dkeyFromDate(cellDate);
      const dayItems = data.items.filter(it => it.date === key);
      let dotClass = '';
      if(dayItems.length > 0){
        const net = dayItems.reduce((s, it) => s + (it.type === 'heal' ? 1 : -1), 0);
        dotClass = net >= 0 ? 'positive' : 'negative';
      }
      const isToday = key === todayStr ? ' today' : '';
      cellsHtml += `
        <div class="month-cell${isToday}">
          <span class="month-daynum">${d}</span>
          <span class="month-dot ${dotClass}"></span>
        </div>`;
    }

    const weekdayRowHtml = DAY_NAMES_SHORT.map(w => `<div class="month-weekday-cell">${w[0]}</div>`).join('');

    return `
      <div class="balance-banner">
        <div class="label">Total Balance</div>
        <div class="value">${balance >= 0 ? '+' : ''}${balance}</div>
        <div class="note">All-time Charging: +${healDone} · Plan: -${planDone}</div>
      </div>

      <div class="month-nav">
        <button class="nav-btn" id="progress-prev-month">‹</button>
        <span class="month-nav-title">${monthName} ${year}</span>
        <button class="nav-btn" id="progress-next-month">›</button>
      </div>

      <div class="monthly-summary-box">
        <div class="monthly-stat-item">
          <span class="m-label">+1 Charging</span>
          <span class="m-val">+${mStats.chargingCount}</span>
        </div>
        <div class="monthly-stat-item">
          <span class="m-label">−1 Plan</span>
          <span class="m-val">-${mStats.planCount}</span>
        </div>
        <div class="monthly-stat-item">
          <span class="m-label">Monthly Net</span>
          <span class="m-val">${mStats.net >= 0 ? '+' : ''}${mStats.net}</span>
        </div>
      </div>

      <div class="month-weekday-row">${weekdayRowHtml}</div>
      <div class="month-grid">${cellsHtml}</div>
    `;
  }

  function charBoarBase(faceInner){
    return `<svg viewBox="0 0 100 100">
      <path d="M28,20 L33,8 L38,20 L43,6 L48,20 L53,6 L58,20 L63,6 L68,20 L73,8" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M20,32 L9,9 L29,23 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M80,32 L91,9 L71,23 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="50" cy="54" r="34" fill="none" stroke="currentColor" stroke-width="4"/>
      ${faceInner}
      <ellipse cx="50" cy="68" rx="14" ry="9" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="45" cy="68" r="1.8" fill="currentColor"/>
      <circle cx="55" cy="68" r="1.8" fill="currentColor"/>
    </svg>`;
  }
  function charBoarNeutral(){
    return charBoarBase(`
      <line class="focus-char-eye" x1="34" y1="48" x2="42" y2="48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line class="focus-char-eye" x1="58" y1="48" x2="66" y2="48" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="animation-delay:0.15s;"/>
    `);
  }
  function charBoarHappy(){
    return charBoarBase(`
      <path d="M33,48 Q38,42 43,48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M57,48 Q62,42 67,48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M40,80 Q50,86 60,80" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    `);
  }
  function charBoarFoul(){
    return charBoarBase(`
      <line x1="32" y1="44" x2="44" y2="49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="68" y1="44" x2="56" y2="49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="38" cy="52" r="2.6" fill="currentColor"/>
      <circle cx="62" cy="52" r="2.6" fill="currentColor"/>
      <path d="M42,82 Q50,76 58,82" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    `);
  }
  function poseMarkup(state){
    if(state === 'happy') return charBoarHappy();
    if(state === 'foul') return charBoarFoul();
    return charBoarNeutral();
  }
  function charInnerHtml(){
    return `<span id="focus-char-pose">${poseMarkup('neutral')}</span>`;
  }

  function renderFocusTab(){
    if(focusSessionSummary){
      const s = focusSessionSummary;
      return `
        <p class="section-title">Session complete</p>
        <div class="focus-summary-card">
          <div class="focus-summary-big">${formatMMSS(s.focusedSec)} <span style="font-size:15px; color:var(--muted); font-weight:500;">focused</span></div>
          <p class="reminder-sub" style="text-align:left; margin-top:2px;">${formatMMSS(s.totalSec)} total session · ${s.foulCount} time${s.foulCount===1?'':'s'} you left the frame</p>
          <p style="margin-top:14px; font-size:13.5px;">${s.logged ? `Logged "${escapeHtml(s.logText)}" for today.` : (s.hadLog ? `Didn't log it — you weren't in frame enough (need ${s.thresholdPct}%+).` : 'No activity was linked to this session.')}</p>
        </div>
        <button class="add-submit-btn" id="focus-dismiss-btn" style="margin-top:16px;">Start another session</button>
      `;
    }

    const voiceSlotHtml = ['greet','good','foul'].map(cat => {
      const label = cat === 'greet' ? 'Greeting' : cat === 'good' ? 'Good' : 'Foul';
      const has = data.voiceClips && data.voiceClips[cat];
      return `
        <div class="char-slot-col">
          ${has
            ? `<button class="quote-add-link" data-removevoice="${cat}">${label} · remove</button>`
            : `<label class="quote-add-link" for="voice-input-${cat}">+ ${label} clip</label>`}
          <input type="file" class="voice-clip-input" id="voice-input-${cat}" data-cat="${cat}" accept="audio/*" style="display:none;" />
        </div>`;
    }).join('');

    const charBlock = `
      <div class="focus-char" id="focus-char"><div class="focus-char-inner" id="focus-char-inner">${charInnerHtml()}</div></div>
      <div class="char-upload-row">
        <button class="reminder-btn${voiceOn ? '' : ' off'}" id="voice-toggle-btn">${voiceOn ? '🔊 Voice on' : '🔇 Voice off'}</button>
      </div>
      <div class="char-upload-row">${voiceSlotHtml}</div>
      <p class="reminder-sub">Upload short recordings for each moment — any that aren't uploaded fall back to the built-in voice.</p>`;

    if(!focusActive){
      const logIconPickerHtml = ICON_KEYS.map(key => `
        <button class="icon-pill${key===focusLogIcon?' active':''}" data-focuslogicon="${key}">${iconMarkup(key)}</button>
      `).join('');
      const logTypePickerHtml = `
        <button class="cat-pill${focusLogType==='plan'?' active':''}" data-focuslogtype="plan">−1 Plan</button>
        <button class="cat-pill${focusLogType==='heal'?' active':''}" data-focuslogtype="heal">+1 Charging</button>`;

      return `
        <p class="section-title">Focus session</p>
        ${charBlock}
        <p class="reminder-sub">Turns on your camera and watches for your face using on-device detection — nothing is uploaded or recorded, it never leaves your phone. If you're out of frame too long, it counts as a foul. Pick an activity below and it'll get logged automatically if you stayed focused enough.</p>
        <div class="picker-label" style="margin-top:16px;">Log as (optional)</div>
        <div class="icon-picker">
          <button class="icon-pill${!focusLogIcon?' active':''}" data-focuslogicon="">✕</button>
          ${logIconPickerHtml}
        </div>
        ${focusLogIcon ? `<div class="type-picker">${logTypePickerHtml}</div>` : ''}
        <div class="picker-label">Duration</div>
        <div class="dur-picker">
          ${[15,30,45,60].map(m=>`<button class="dur-pill${m===focusDurationMin?' active':''}" data-focusdur="${m}">${m}m</button>`).join('')}
        </div>
        <button class="add-submit-btn" id="start-focus-btn" ${focusModelLoading?'disabled':''}>${focusModelLoading ? 'Loading…' : 'Start focus session'}</button>
      `;
    }

    return `
      <p class="section-title">Focus session</p>
      <div class="focus-video-wrap">
        <video id="focus-video" autoplay playsinline muted class="${blurCamera ? 'blurred' : ''}"></video>
        <button class="blur-toggle-btn" id="blur-toggle-btn">${blurCamera ? '🌫 Blurred' : '👁 Clear'}</button>
      </div>
      ${charBlock}
      <div class="focus-stat-row">
        <span class="focus-timer" id="focus-timer-text">${formatMMSS(Math.max(0, focusDurationMin*60 - focusElapsedSec))}</span>
        <span class="focus-substat" id="focus-substat-text">Focused ${formatMMSS(focusedSec)}<br/>Fouls: ${foulCount}</span>
      </div>
      <div class="focus-feedback" id="focus-feedback-text">${escapeHtml(focusFeedbackLine)}</div>
      <button class="reminder-btn off" id="stop-focus-btn" style="margin-top:14px;">End session</button>
    `;
  }

  async function startFocusSession(){
    focusModelLoading = true;
    render();
    try{
      if(!focusModel) focusModel = await blazeface.load();
    }catch(e){
      focusModelLoading = false;
      alert('얼굴 인식 모델을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요.');
      render();
      return;
    }
    try{
      focusStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }catch(e){
      focusModelLoading = false;
      alert('카메라 권한이 필요해요. 브라우저 설정에서 카메라 허용 여부를 확인해주세요.');
      render();
      return;
    }

    focusModelLoading = false;
    focusActive = true;
    focusElapsedSec = 0;
    focusedSec = 0;
    foulCount = 0;
    consecutiveMissing = 0;
    focusFeedbackLine = '카메라 연결됐어. 시작한다.';
    speakLine('greet', focusFeedbackLine);
    render();

    const video = document.getElementById('focus-video');
    if(video){ video.srcObject = focusStream; video.play().catch(()=>{}); }

    focusTimerInterval = setInterval(() => {
      focusElapsedSec += 1;
      const timerEl = document.getElementById('focus-timer-text');
      if(timerEl) timerEl.textContent = formatMMSS(Math.max(0, focusDurationMin*60 - focusElapsedSec));
      if(focusElapsedSec >= focusDurationMin*60) endFocusSession();
    }, 1000);

    scheduleFaceCheck();
  }

  function scheduleFaceCheck(){
    if(!focusActive) return;
    detectFaceOnce().finally(() => {
      if(focusActive) setTimeout(scheduleFaceCheck, 1000);
    });
  }

  async function detectFaceOnce(){
    let faceSeen = false;
    try{
      const video = document.getElementById('focus-video');
      if(video && video.readyState >= 2 && focusModel){
        const predictions = await focusModel.estimateFaces(video, false);
        faceSeen = predictions.length > 0;
      }
    }catch(e){ faceSeen = false; }

    const poseEl = document.getElementById('focus-char-pose');
    const charEl = document.getElementById('focus-char');

    if(faceSeen){
      focusedSec += 1;
      consecutiveMissing = 0;
      if(poseEl) poseEl.innerHTML = poseMarkup('neutral');
      if(focusedSec % 20 === 0){
        focusFeedbackLine = FOCUS_LINES_OK[Math.floor(Math.random()*FOCUS_LINES_OK.length)];
        speakLine('good', focusFeedbackLine);
        const fb = document.getElementById('focus-feedback-text'); if(fb) fb.textContent = focusFeedbackLine;
        if(poseEl) poseEl.innerHTML = poseMarkup('happy');
        setTimeout(() => {
          const el = document.getElementById('focus-char-pose');
          if(el) el.innerHTML = poseMarkup('neutral');
        }, 2500);
      }
    }else{
      consecutiveMissing += 1;
      if(consecutiveMissing === 3){
        foulCount += 1;
        focusFeedbackLine = FOCUS_LINES_FOUL[Math.floor(Math.random()*FOCUS_LINES_FOUL.length)];
        speakLine('foul', focusFeedbackLine);
        const fb = document.getElementById('focus-feedback-text'); if(fb) fb.textContent = focusFeedbackLine;
        if(poseEl) poseEl.innerHTML = poseMarkup('foul');
        if(charEl){ charEl.classList.remove('shake'); void charEl.offsetWidth; charEl.classList.add('shake'); }
      }
    }

    const substatEl = document.getElementById('focus-substat-text');
    if(substatEl) substatEl.innerHTML = `Focused ${formatMMSS(focusedSec)}<br/>Fouls: ${foulCount}`;
  }

  async function endFocusSession(){
    if(focusTimerInterval){ clearInterval(focusTimerInterval); focusTimerInterval = null; }
    if(focusStream){ focusStream.getTracks().forEach(t => t.stop()); focusStream = null; }
    focusActive = false;

    const thresholdPct = 60;
    let logged = false;
    let logText = '';
    const hadLog = !!focusLogIcon;
    if(focusLogIcon && focusElapsedSec > 0){
      logText = ICON_LABELS[focusLogIcon] || 'Focus session';
      const p = (focusedSec / focusElapsedSec) * 100;
      if(p >= thresholdPct){
        data.items.push({ id: uid(), icon: focusLogIcon, type: focusLogType, text: logText, date: todayKey() });
        logged = true;
        await save();
      }
    }

    focusSessionSummary = { focusedSec, totalSec: focusElapsedSec, foulCount, logged, logText, hadLog, thresholdPct };
    render();
  }

  function render(){
    applyTheme();

    const tabsHtml = `
      <div class="tabs">
        <button class="tab-btn${activeTab==='today'?' active':''}" data-tab="today">Today</button>
        <button class="tab-btn${activeTab==='progress'?' active':''}" data-tab="progress">Progress</button>
        <button class="tab-btn${activeTab==='focus'?' active':''}" data-tab="focus">Focus</button>
      </div>`;

    root.innerHTML = `
      <div class="top-bar">
        <p class="eyebrow">DAILY</p>
        <button class="theme-toggle" id="theme-toggle">${theme === 'dark' ? 'Light' : 'Dark'}</button>
      </div>
      ${tabsHtml}
      ${activeTab === 'today' ? renderTodayTab() : activeTab === 'progress' ? renderProgressTab() : renderFocusTab()}
    `;

    bindEvents();
  }

  function bindEvents(){
    const themeBtn = document.getElementById('theme-toggle');
    if(themeBtn){
      themeBtn.addEventListener('click', async () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        await storageSet('daily-theme-pref', theme);
        render();
      });
    }

    root.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    if(activeTab === 'focus'){ bindFocusEvents(); return; }
    if(activeTab === 'progress'){ bindProgressEvents(); return; }
    if(activeTab !== 'today') return;

    root.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        data.items = data.items.filter(it => it.id !== id);
        render(); await save();
      });
    });

    root.querySelectorAll('[data-itemtype]').forEach(btn => {
      btn.addEventListener('click', () => { newItemType = btn.dataset.itemtype; render(); });
    });

    root.querySelectorAll('[data-iconkey]').forEach(btn => {
      btn.addEventListener('click', () => {
        newItemIcon = btn.dataset.iconkey;
        render();
        const input = document.getElementById('add-input'); if(input) input.focus();
      });
    });

    async function submitItem(){
      const input = document.getElementById('add-input');
      const typed = input ? input.value.trim() : '';
      const text = typed || ICON_LABELS[newItemIcon] || 'Item';
      data.items.push({ id: uid(), icon: newItemIcon, type: newItemType, text, date: todayKey() });
      newItemText = ''; newItemType = 'plan';
      render(); await save();
      const again = document.getElementById('add-input'); if(again) again.focus();
    }

    const input = document.getElementById('add-input');
    if(input){
      input.addEventListener('input', () => { newItemText = input.value; });
      input.addEventListener('keydown', async (e) => { if(e.key === 'Enter') await submitItem(); });
    }
    const addBtn = document.getElementById('add-btn');
    if(addBtn){ addBtn.addEventListener('click', submitItem); }
  }

  function bindProgressEvents(){
    const prevBtn = document.getElementById('progress-prev-month');
    if(prevBtn){
      prevBtn.addEventListener('click', () => {
        progressMonth = new Date(progressMonth.getFullYear(), progressMonth.getMonth()-1, 1);
        render();
      });
    }
    const nextBtn = document.getElementById('progress-next-month');
    if(nextBtn){
      nextBtn.addEventListener('click', () => {
        progressMonth = new Date(progressMonth.getFullYear(), progressMonth.getMonth()+1, 1);
        render();
      });
    }
  }

  function bindFocusEvents(){
    const blurBtn = document.getElementById('blur-toggle-btn');
    if(blurBtn){
      blurBtn.addEventListener('click', async () => {
        blurCamera = !blurCamera;
        const video = document.getElementById('focus-video');
        if(video) video.classList.toggle('blurred', blurCamera);
        blurBtn.textContent = blurCamera ? '🌫 Blurred' : '👁 Clear';
        await storageSet('daily-blur-pref', blurCamera ? 'on' : 'off');
      });
    }

    const voiceBtn = document.getElementById('voice-toggle-btn');
    if(voiceBtn){
      voiceBtn.addEventListener('click', async () => {
        voiceOn = !voiceOn;
        if(!voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        await storageSet('daily-voice-pref', voiceOn ? 'on' : 'off');
        render();
      });
    }

    root.querySelectorAll('.voice-clip-input').forEach(inputEl => {
      inputEl.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const cat = inputEl.dataset.cat;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          if(!data.voiceClips) data.voiceClips = {};
          data.voiceClips[cat] = ev.target.result;
          await save();
          render();
        };
        reader.readAsDataURL(file);
      });
    });

    root.querySelectorAll('[data-removevoice]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        const cat = btn.dataset.removevoice;
        if(data.voiceClips) delete data.voiceClips[cat];
        await save();
        render();
      });
    });

    root.querySelectorAll('[data-focuslogicon]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusLogIcon = btn.dataset.focuslogicon || null;
        render();
      });
    });

    root.querySelectorAll('[data-focuslogtype]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusLogType = btn.dataset.focuslogtype;
        render();
      });
    });

    root.querySelectorAll('[data-focusdur]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusDurationMin = parseInt(btn.dataset.focusdur, 10);
        render();
      });
    });

    const startBtn = document.getElementById('start-focus-btn');
    if(startBtn){ startBtn.addEventListener('click', () => { unlockVoice(); startFocusSession(); }); }

    const stopBtn = document.getElementById('stop-focus-btn');
    if(stopBtn){ stopBtn.addEventListener('click', endFocusSession); }

    if(focusActive){
      const video = document.getElementById('focus-video');
      if(video && focusStream && video.srcObject !== focusStream){
        video.srcObject = focusStream;
        video.play().catch(()=>{});
      }
    }

    const dismissBtn = document.getElementById('focus-dismiss-btn');
    if(dismissBtn){
      dismissBtn.addEventListener('click', () => {
        focusSessionSummary = null;
        focusLogIcon = null;
        render();
      });
    }
  }

  load();
})();
</script>
</body>
</html>
