<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Weekly" />
<title>Weekly</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#111111; --paper:#ffffff; --muted:#9a9a9a; --faint:#d8d8d8;
    --hover:#f7f7f7; --band:#f2f2f2; --divider:#e4e4e4; --track-bg:#ececec;
  }
  html[data-theme="dark"]{
    --ink:#ffffff; --paper:#111111; --muted:#8a8a8a; --faint:#3a3a3a;
    --hover:#1c1c1c; --band:#1c1c1c; --divider:#2a2a2a; --track-bg:#2a2a2a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #root{ max-width:420px; margin:0 auto; padding:36px 22px 90px; min-height:100vh; }

  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0; }
  .theme-toggle{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:5px 11px; border-radius:12px; cursor:pointer; }
  .theme-toggle:hover{ background:var(--hover); }

  .quote-block{ margin:2px 0 22px; }
  .quote-row{ display:flex; align-items:baseline; gap:8px; }
  .quote-text{ font-family:'Space Grotesk', sans-serif; font-style:italic; font-size:14px; line-height:1.5; flex:1; }
  .quote-shuffle{ flex:none; background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0; line-height:1; }
  .quote-shuffle:hover{ color:var(--ink); }
  .quote-add-link{ background:none; border:none; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); cursor:pointer; padding:0; margin-top:6px; text-decoration:underline; text-underline-offset:2px; }
  .quote-add-link:hover{ color:var(--ink); }
  .new-quote-row{ display:flex; gap:8px; margin-top:8px; }
  .new-quote-input{ flex:1; border:1.3px solid var(--ink); border-radius:8px; padding:8px 10px; font-family:'Inter', sans-serif; font-size:13px; outline:none; background:var(--paper); color:var(--ink); }

  .tabs{ display:flex; gap:20px; margin-bottom:24px; border-bottom:1px solid var(--divider); }
  .tab-btn{ background:none; border:none; cursor:pointer; padding:0 0 10px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.05em; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--ink); }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:22px; letter-spacing:-0.01em; }
  .cal-nav{ display:flex; align-items:center; gap:4px; }
  .nav-btn, .today-btn{ border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:5px 9px; border-radius:3px; cursor:pointer; line-height:1; }
  .nav-btn:hover, .today-btn:hover{ background:var(--hover); }

  .weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; }
  .weekday-cell{ text-align:center; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); letter-spacing:0.05em; }

  .cal-grid{ margin-bottom:6px; }
  .week-row{ display:grid; grid-template-columns:repeat(7,1fr); align-items:start; border:1px solid var(--ink); border-radius:9px; padding:8px 2px 9px; margin-bottom:7px; cursor:pointer; transition:background 0.12s ease; }
  .week-row:hover{ background:var(--hover); }
  .week-row.selected{ background:var(--band); border-width:1.6px; }

  .day-cell{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .day-num{ width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:12.5px; }
  .day-cell.outside .day-num{ color:var(--faint); }
  .day-cell.today .day-num{ background:var(--ink); color:var(--paper); font-weight:600; }

  .day-dots{ display:flex; gap:2.5px; min-height:6px; align-items:center; }
  .day-dot{ width:5px; height:5px; border-radius:50%; background:var(--ink); }
  .day-dot-more{ font-family:'JetBrains Mono', monospace; font-size:8px; color:var(--muted); }

  .divider{ border:none; border-top:1px solid var(--ink); margin:18px 0 4px; }

  .summary-banner{ border:1px solid var(--ink); border-radius:8px; padding:14px 16px; margin:16px 0 4px; background:var(--band); }
  .summary-banner .label{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .summary-banner .msg{ font-size:14px; line-height:1.5; }

  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; margin:16px 0 10px; }
  .panel-range{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:17px; }
  .panel-frac{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }

  .list{ list-style:none; margin:0; padding:0; }
  .item-card{ padding:14px 2px; border-bottom:1px solid var(--divider); }
  .item-card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .item-card-title{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
  .item-name{ font-size:15px; line-height:1.4; word-break:break-word; }
  .cat-tag{ flex:none; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); background:var(--band); padding:2px 7px; border-radius:8px; }
  .plan-tag{ flex:none; font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); }
  .item-card-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .item-frac{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .del-btn{ flex:none; width:20px; height:20px; border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer; line-height:1; }
  .del-btn:hover{ color:var(--ink); }

  .item-day-toggles{ display:flex; gap:6px; margin-top:11px; }
  .day-toggle{ width:30px; height:30px; border-radius:50%; border:1.4px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .day-toggle.done{ background:var(--ink); color:var(--paper); }
  .day-toggle[disabled]{ cursor:default; opacity:0.55; }

  .item-empty{ padding:24px 2px; color:var(--muted); font-size:14px; text-align:center; }

  .add-block{ padding:14px 2px 4px; border-bottom:1px solid var(--divider); }
  .picker-label{ font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }

  .category-picker{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .cat-pill{ border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:6px 12px; border-radius:14px; cursor:pointer; white-space:nowrap; }
  .cat-pill.active{ background:var(--ink); color:var(--paper); }
  .cat-pill.add-cat{ width:28px; height:28px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .new-cat-input{ border:1.3px solid var(--ink); border-radius:14px; padding:5px 12px; font-family:'Inter', sans-serif; font-size:12.5px; outline:none; color:var(--ink); background:var(--paper); }

  .target-stepper{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .stepper-btn{ width:28px; height:28px; border-radius:50%; border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .stepper-btn:hover{ background:var(--hover); }
  .stepper-value{ font-family:'JetBrains Mono', monospace; font-size:13.5px; min-width:64px; text-align:center; }

  .day-picker{ display:flex; gap:5px; margin-bottom:14px; flex-wrap:wrap; }
  .day-pill{ border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:10.5px; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .day-pill.active{ background:var(--ink); color:var(--paper); }

  .dur-picker{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .dur-pill{ border:1.3px solid var(--ink); background:var(--paper); color:var(--ink); font-family:'JetBrains Mono', monospace; font-size:11px; padding:6px 11px; border-radius:14px; cursor:pointer; white-space:nowrap; }
  .dur-pill.active{ background:var(--ink); color:var(--paper); }

  .time-input, .location-input{ border:1.3px solid var(--ink); border-radius:8px; padding:8px 10px; margin-bottom:14px; font-family:'Inter', sans-serif; font-size:13px; background:var(--paper); color:var(--ink); width:100%; }
  .time-input{ font-family:'JetBrains Mono', monospace; width:auto; }
  .time-select-row{ display:flex; align-items:center; gap:6px; margin-bottom:14px; }
  .time-select{
    border:1.3px solid var(--ink); border-radius:8px; padding:8px 10px;
    font-family:'JetBrains Mono', monospace; font-size:13px; background:var(--paper); color:var(--ink);
  }
  .time-sep{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--muted); }

  .add-row{ display:flex; align-items:center; gap:10px; padding-bottom:14px; }
  .add-plus{ font-family:'JetBrains Mono', monospace; font-size:16px; color:var(--muted); flex:none; }
  .add-input{ flex:1; border:none; outline:none; font-family:'Inter', sans-serif; font-size:15px; background:transparent; color:var(--ink); }
  .add-input::placeholder{ color:var(--muted); }
  .add-submit-btn{ flex:none; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:8px 14px; border-radius:16px; cursor:pointer; }
  .add-submit-btn:hover{ opacity:0.85; }

  .readonly-note{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); margin-top:10px; }

  .reminder-block{ margin-top:30px; }
  .reminder-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .reminder-row{ display:flex; align-items:center; justify-content:space-between; border:1px solid var(--ink); border-radius:8px; padding:12px 14px; gap:12px; }
  .reminder-text{ font-size:13px; line-height:1.5; color:var(--ink); }
  .reminder-btn{ border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-family:'JetBrains Mono', monospace; font-size:11px; padding:7px 10px; border-radius:5px; cursor:pointer; flex:none; }
  .reminder-btn.off{ background:var(--paper); color:var(--ink); }
  .reminder-sub{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }

  .stat-hero{ margin-bottom:30px; }
  .stat-hero .big{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:56px; line-height:1; letter-spacing:-0.02em; }
  .stat-hero .sub{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); margin-top:8px; }

  .section-title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin:28px 0 12px; }

  .bar-row{ margin-bottom:14px; }
  .bar-row-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:10px; }
  .bar-row-label{ font-size:13.5px; }
  .bar-row-score{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); flex:none; }
  .bar-track{ height:6px; background:var(--track-bg); border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--ink); border-radius:3px; }
  .empty-progress{ color:var(--muted); font-size:14px; padding:20px 0; }

  .sched-day-block{ margin-bottom:22px; }
  .sched-day-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14.5px; margin-bottom:8px; }
  .sched-row{ display:flex; align-items:baseline; gap:10px; padding:9px 2px; border-bottom:1px solid var(--divider); }
  .sched-time{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); width:82px; flex:none; }
  .sched-title{ flex:1; font-size:14px; line-height:1.4; word-break:break-word; }
  .sched-loc{ color:var(--muted); font-size:11.5px; }
  .sched-empty{ color:var(--muted); font-size:13px; padding:4px 0 2px; }

  .focus-char{ width:76px; height:76px; margin:0 auto 4px; color:var(--ink); }
  .focus-char svg{ width:100%; height:100%; overflow:visible; }
  .focus-char-face{ animation: charBob 2.4s ease-in-out infinite; transform-origin:50px 50px; transform-box: fill-box; }
  @keyframes charBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }
  .focus-char-eye{ animation: charBlink 4.5s infinite; transform-origin:center; transform-box: fill-box; }
  @keyframes charBlink{ 0%,92%,100%{ transform:scaleY(1);} 96%{ transform:scaleY(0.1);} }
  .focus-char.shake{ animation: charShake 0.4s ease; }
  @keyframes charShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .focus-video-wrap{ position:relative; width:100%; border-radius:10px; overflow:hidden; border:1px solid var(--ink); background:#000; }
  #focus-video{ width:100%; display:block; aspect-ratio:4/3; object-fit:cover; }
  .focus-stat-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; }
  .focus-timer{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:32px; letter-spacing:-0.01em; }
  .focus-substat{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); text-align:right; line-height:1.6; }
  .focus-feedback{ margin-top:12px; padding:12px 14px; border:1px solid var(--ink); border-radius:8px; font-size:13.5px; line-height:1.5; min-height:20px; }
  .focus-select{ border:1.3px solid var(--ink); border-radius:8px; padding:9px 10px; font-family:'Inter', sans-serif; font-size:13.5px; background:var(--paper); color:var(--ink); width:100%; margin-bottom:16px; }
  .focus-summary-card{ border:1px solid var(--ink); border-radius:10px; padding:18px; }
  .focus-summary-big{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; margin-bottom:6px; }

  .status{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); text-align:center; padding:60px 0; }
</style>
</head>
<body>
<div id="root"><div class="status">Loading…</div></div>

<script>
(function(){
  const STORAGE_KEY = 'weekly-app-data-v6';
  const root = document.getElementById('root');
  const WD_SHORT = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DEFAULT_CATEGORIES = ['Exercise','Study','Hobby'];
  const DEFAULT_QUOTES = [
    'Small steps still move you forward.',
    "You don't need a perfect week, just a checked box.",
    'Progress, not perfection.',
    'Today counts too.',
    'One box at a time.',
    'Consistency beats intensity.',
    'You showed up. That\u2019s the hard part.',
    'Future you is already grateful.',
    'Done is better than perfect.',
    'Keep going. This week is yours.'
  ];

  function dkey(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff); date.setHours(0,0,0,0);
    return date;
  }
  function currentWeekId(){ return dkey(getMonday(new Date())); }

  function weekRangeLabel(weekIdStr){
    const monday = new Date(weekIdStr + 'T00:00:00');
    const sunday = addDays(monday,6);
    if(monday.getMonth() === sunday.getMonth()){
      return `${MONTHS_SHORT[monday.getMonth()]} ${monday.getDate()} – ${sunday.getDate()}`;
    }
    return `${MONTHS_SHORT[monday.getMonth()]} ${monday.getDate()} – ${MONTHS_SHORT[sunday.getMonth()]} ${sunday.getDate()}`;
  }
  function monthLabel(d){ return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
  function pct(done,total){ return total ? Math.round((done/total)*100) : 0; }

  function computeEndTime(time, duration){
    if(!time || !duration) return null;
    const [h,m] = time.split(':').map(Number);
    const total = h*60 + m + duration;
    const eh = Math.floor((total/60) % 24);
    const em = total % 60;
    return `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
  }

  const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage;
  async function storageGet(key){
    if(hasClaudeStorage){
      try{ const res = await window.storage.get(key, false); return res ? res.value : null; }
      catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(hasClaudeStorage){
      try{ await window.storage.set(key, value, false); }catch(e){ console.error('Save failed', e); }
      return;
    }
    try{ localStorage.setItem(key, value); }catch(e){ console.error('Save failed', e); }
  }

  let data = { weeks: {}, categories: [], quotes: [] };
  let viewMonth = new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);
  let selectedWeekId = currentWeekId();
  let newItemCategory = DEFAULT_CATEGORIES[0];
  let newItemTarget = 3;
  let newItemText = '';
  let newItemPlanDays = [];
  let newItemPlanTime = '';
  let newItemPlanDuration = null;
  let newItemPlanLocation = '';
  let addingCategory = false;
  let newCatText = '';
  let notifyOn = false;
  let accountabilityPhone = '';
  let editingPhone = false;
  let generatingReport = false;
  let lockNotice = false;

  // Focus session (local face-detection, no server calls)
  let focusActive = false;
  let focusStream = null;
  let focusModel = null;
  let focusModelLoading = false;
  let focusDurationMin = 30;
  let focusSelectedItemId = null;
  let focusElapsedSec = 0;
  let focusedSec = 0;
  let foulCount = 0;
  let consecutiveMissing = 0;
  let focusTimerInterval = null;
  let focusFeedbackLine = '';
  let focusSessionSummary = null;

  const FOCUS_LINES_OK = [
    '좋아, 지금 아주 잘하고 있어.',
    '이대로 쭉 가자.',
    '집중력 좋은데?',
    '흐트러지지 마.'
  ];
  const FOCUS_LINES_FOUL = [
    '어디 갔었어? 집중해!',
    '화면으로 다시 와.',
    '방금 딴 데 봤지?',
    '자리 비우지 마.'
  ];

  function formatMMSS(sec){
    const m = Math.floor(sec/60), s = sec%60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  let activeTab = 'week';
  let theme = 'light';
  let currentQuote = '';
  let addingQuote = false;

  function pickRandomQuote(){
    const pool = [...DEFAULT_QUOTES, ...(data.quotes || [])];
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function applyTheme(){
    if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
    else document.documentElement.removeAttribute('data-theme');
  }

  function itemPlanDays(it){
    if(Array.isArray(it.planDays)) return it.planDays;
    if(it.planDay !== null && it.planDay !== undefined) return [it.planDay];
    return [];
  }

  function planTimeLabel(it){
    const end = computeEndTime(it.planTime, it.planDuration);
    if(it.planTime) return end ? `${it.planTime}–${end}` : it.planTime;
    if(it.planDuration) return `${it.planDuration < 60 ? it.planDuration+'m' : (it.planDuration/60)+'h'}`;
    return '';
  }

  function doneDays(rec, itemId){ return rec.completions[itemId] || []; }
  function doneCount(rec, item){ return Math.min(doneDays(rec, item.id).length, item.target); }
  async function generateWeeklyReport(weekId){
    const rec = data.weeks[weekId];
    if(!rec) return null;
    const { target, done } = weekTotals(rec);
    const lines = rec.items.map(it => {
      const cnt = doneCount(rec, it);
      return `- [${it.category}] ${it.text}: ${cnt}/${it.target}`;
    }).join('\n');

    const prompt = `다음은 한 사람의 이번 주(${weekRangeLabel(weekId)}) 습관 체크리스트 결과예요.

전체: ${done}/${target} 완료

항목별:
${lines || '(등록된 항목 없음)'}

이 데이터를 바탕으로, 이 사람에게 보낼 "이번 주 평가서"를 딱 한 문단(3~5문장)으로 써줘. 조건:
- 냉정하고 팩트 위주로, 봐주지 말고 솔직하게 쓸 것 (소위 "팩폭" 스타일)
- 잘한 부분이 있으면 그것도 사실대로 언급하되, 못한 부분을 절대 순화하거나 얼버무리지 말 것
- 숫자(퍼센트, 횟수)를 반드시 인용할 것
- 존댓말이나 이모지 없이, 반말로 직설적으로
- 다른 설명이나 인사말 없이 평가서 본문만 출력할 것`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 400,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const responseData = await response.json();
    const text = (responseData.content || [])
      .map(block => block.type === 'text' ? block.text : '')
      .join('')
      .trim();
    return text || null;
  }

  function weekTotals(rec){
    let target = 0, done = 0;
    rec.items.forEach(it => { target += it.target; done += doneCount(rec, it); });
    return { target, done };
  }

  async function load(){
    try{
      const raw = await storageGet(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : { weeks: {}, categories: [], quotes: [] };
    }catch(e){ data = { weeks: {}, categories: [], quotes: [] }; }
    if(!data.weeks) data.weeks = {};
    if(!data.categories || !data.categories.length) data.categories = [...DEFAULT_CATEGORIES];
    if(!data.quotes) data.quotes = [];
    newItemCategory = data.categories[0];

    const nowId = currentWeekId();
    if(!data.weeks[nowId]){
      const priorIds = Object.keys(data.weeks).filter(id => id < nowId).sort();
      const priorId = priorIds[priorIds.length - 1];
      const carriedItems = priorId
        ? data.weeks[priorId].items.map(it => ({
            id: it.id, text: it.text, category: it.category, target: it.target,
            planDays: itemPlanDays(it), planTime: it.planTime, planDuration: it.planDuration, planLocation: it.planLocation
          }))
        : [];
      data.weeks[nowId] = { items: carriedItems, completions: {} };
      await save();
    }
    selectedWeekId = nowId;

    notifyOn = (await storageGet('weekly-notify-pref')) === 'on';
    accountabilityPhone = (await storageGet('weekly-accountability-phone')) || '';
    theme = (await storageGet('weekly-theme-pref')) === 'dark' ? 'dark' : 'light';
    currentQuote = pickRandomQuote();

    render();

  function buildCalendarGrid(){
    const monthStart = new Date(viewMonth);
    const monthEnd = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0);
    const gridStart = getMonday(monthStart);
    const gridEnd = addDays(getMonday(monthEnd), 6);
    const today = dkey(new Date());
    const weeks = [];
    let cursor = new Date(gridStart);
    while(cursor <= gridEnd){
      const weekId = dkey(cursor);
      const days = [];
      for(let i=0;i<7;i++){
        const d = addDays(cursor,i);
        days.push({ dnum:d.getDate(), outside: d.getMonth() !== viewMonth.getMonth(), isToday: dkey(d) === today, weekdayIdx:i });
      }
      weeks.push({ weekId, days });
      cursor = addDays(cursor,7);
    }
    return weeks;
  }

  function nearestPriorWeekWithItems(weekId){
    const ids = Object.keys(data.weeks).filter(id => id < weekId && data.weeks[id].items.length > 0).sort();
    return ids.length ? ids[ids.length - 1] : null;
  }

  function aggregateStats(){
    const weekIds = Object.keys(data.weeks).sort();
    let totalTarget=0, totalDone=0;
    const perCategory = {};
    const weeklyTrend = [];
    weekIds.forEach(wid => {
      const rec = data.weeks[wid];
      const { target, done } = weekTotals(rec);
      totalTarget += target; totalDone += done;
      weeklyTrend.push({ weekId: wid, total: target, done });
      rec.items.forEach(it=>{
        const cat = it.category || 'Uncategorized';
        if(!perCategory[cat]) perCategory[cat] = { total:0, done:0 };
        perCategory[cat].total += it.target;
        perCategory[cat].done += doneCount(rec, it);
      });
    });
    return { totalTarget, totalDone, perCategory, weeklyTrend };
  }

    }
    try{
      focusStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }catch(e){
      focusModelLoading = false;
      alert('카메라 권한이 필요해요. 브라우저 설정에서 카메라 허용 여부를 확인해주세요.');
      render();
      return;
    }

    focusModelLoading = false;
    focusActive = true;
    focusElapsedSec = 0;
    focusedSec = 0;
    foulCount = 0;
    consecutiveMissing = 0;
    focusFeedbackLine = '카메라 연결됐어. 시작한다.';
    render();

    const video = document.getElementById('focus-video');
    if(video){ video.srcObject = focusStream; video.play().catch(()=>{}); }

    // Timer: simple, synchronous, can never be blocked by face-detection work.
    focusTimerInterval = setInterval(() => {
      focusElapsedSec += 1;
      const timerEl = document.getElementById('focus-timer-text');
      if(timerEl) timerEl.textContent = formatMMSS(Math.max(0, focusDurationMin*60 - focusElapsedSec));
      if(focusElapsedSec >= focusDurationMin*60) endFocusSession();
    }, 1000);

    // Face detection: runs independently via self-scheduling loop so a slow/hung
    // estimateFaces() call can never stall the timer above.
    scheduleFaceCheck();
  }

  function scheduleFaceCheck(){
    if(!focusActive) return;
    detectFaceOnce().finally(() => {
      if(focusActive) setTimeout(scheduleFaceCheck, 1000);
    });
  }

  async function detectFaceOnce(){
    let faceSeen = false;
    try{
      const video = document.getElementById('focus-video');
      if(video && video.readyState >= 2 && focusModel){
        const predictions = await focusModel.estimateFaces(video, false);
        faceSeen = predictions.length > 0;
      }
    }catch(e){ faceSeen = false; }

    const mouthEl = document.getElementById('focus-char-mouth');
    const charEl = document.getElementById('focus-char');

    if(faceSeen){
      focusedSec += 1;
      consecutiveMissing = 0;
      if(mouthEl) mouthEl.setAttribute('d', 'M35,66 Q50,78 65,66');
      if(focusedSec % 20 === 0){
        focusFeedbackLine = FOCUS_LINES_OK[Math.floor(Math.random()*FOCUS_LINES_OK.length)];
        const fb = document.getElementById('focus-feedback-text'); if(fb) fb.textContent = focusFeedbackLine;
      }
    }else{
      consecutiveMissing += 1;
      if(mouthEl) mouthEl.setAttribute('d', 'M35,72 Q50,60 65,72');
      if(consecutiveMissing === 3){
        foulCount += 1;
        focusFeedbackLine = FOCUS_LINES_FOUL[Math.floor(Math.random()*FOCUS_LINES_FOUL.length)];
        const fb = document.getElementById('focus-feedback-text'); if(fb) fb.textContent = focusFeedbackLine;
        if(charEl){ charEl.classList.remove('shake'); void charEl.offsetWidth; charEl.classList.add('shake'); }
      }
    }

    const substatEl = document.getElementById('focus-substat-text');
    if(substatEl) substatEl.innerHTML = `Focused ${formatMMSS(focusedSec)}<br/>Fouls: ${foulCount}`;
  }

  async function endFocusSession(){
    if(focusTimerInterval){ clearInterval(focusTimerInterval); focusTimerInterval = null; }
    if(focusStream){ focusStream.getTracks().forEach(t => t.stop()); focusStream = null; }
    focusActive = false;

    const thresholdPct = 60;
    let marked = false;
    let itemText = '';
    if(focusSelectedItemId && focusElapsedSec > 0){
      const nowId = currentWeekId();
      const rec = data.weeks[nowId];
      const item = rec ? rec.items.find(it => it.id === focusSelectedItemId) : null;
      if(item){
        itemText = item.text;
        const pct = (focusedSec / focusElapsedSec) * 100;
        if(pct >= thresholdPct){
          const todayIdx = (new Date().getDay() + 6) % 7;
          const arr = rec.completions[item.id] || [];
          if(!arr.includes(todayIdx)){ rec.completions[item.id] = [...arr, todayIdx].sort(); }
          marked = true;
          await save();
        }
      }
    }

    focusSessionSummary = { focusedSec, totalSec: focusElapsedSec, foulCount, itemText, marked, thresholdPct };
    render();
  }

  function render(){
    applyTheme();

    const tabsHtml = `
      <div class="tabs">
        <button class="tab-btn${activeTab==='week'?' active':''}" data-tab="week">This Week</button>
        <button class="tab-btn${activeTab==='schedule'?' active':''}" data-tab="schedule">Schedule</button>
        <button class="tab-btn${activeTab==='progress'?' active':''}" data-tab="progress">Progress</button>
        <button class="tab-btn${activeTab==='focus'?' active':''}" data-tab="focus">Focus</button>
      </div>`;

    const quoteHtml = `
      <div class="quote-block">
        <div class="quote-row">
          <span class="quote-text">"${escapeHtml(currentQuote)}"</span>
          <button class="quote-shuffle" id="quote-shuffle" title="Show another">↻</button>
        </div>
        ${addingQuote ? `
          <div class="new-quote-row"><input class="new-quote-input" id="new-quote-input" type="text" placeholder="Your own line... (Enter)" /></div>
        ` : `<button class="quote-add-link" id="quote-add-toggle">+ add your own</button>`}
      </div>`;

    root.innerHTML = `
      <div class="top-bar">
        <p class="eyebrow">WEEKLY</p>
        <button class="theme-toggle" id="theme-toggle">${theme === 'dark' ? 'Light' : 'Dark'}</button>
      </div>
      ${quoteHtml}
      ${tabsHtml}
      ${activeTab === 'week' ? renderWeekTab() : activeTab === 'schedule' ? renderScheduleTab() : activeTab === 'focus' ? renderFocusTab() : renderProgressTab()}
    `;

    bindEvents();
  }

  function bindEvents(){
    const shuffleBtn = document.getElementById('quote-shuffle');
    if(shuffleBtn){ shuffleBtn.addEventListener('click', () => { currentQuote = pickRandomQuote(); render(); }); }

    const quoteAddToggle = document.getElementById('quote-add-toggle');
    if(quoteAddToggle){
      quoteAddToggle.addEventListener('click', () => {
        addingQuote = true; render();
        const input = document.getElementById('new-quote-input'); if(input) input.focus();
      });
    }

    const newQuoteInput = document.getElementById('new-quote-input');
    if(newQuoteInput){
      newQuoteInput.addEventListener('keydown', async (e) => {
        if(e.key === 'Enter'){
          const val = newQuoteInput.value.trim();
          if(!val) return;
          data.quotes.push(val);
          currentQuote = val;
          addingQuote = false;
          render(); await save();
        }
        if(e.key === 'Escape'){ addingQuote = false; render(); }
      });
    }

    const themeBtn = document.getElementById('theme-toggle');
    if(themeBtn){
      themeBtn.addEventListener('click', async () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        await storageSet('weekly-theme-pref', theme);
        render();
      });
    }

    root.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    if(activeTab === 'focus'){ bindFocusEvents(); return; }
    if(activeTab !== 'week') return;

    root.querySelectorAll('.week-row').forEach(row => {
      row.addEventListener('click', async () => {
        const clickedId = row.dataset.week;
        const nowId = currentWeekId();
        if(clickedId > nowId){
          const curRec = data.weeks[nowId];
          const hasItemsThisWeek = curRec && curRec.items.length > 0;
          if(hasItemsThisWeek && !curRec.reportSent){
            lockNotice = true;
            selectedWeekId = nowId;
            render();
            return;
          }
        }
        lockNotice = false;
        selectedWeekId = clickedId;
        if(selectedWeekId >= nowId && !data.weeks[selectedWeekId]){
          data.weeks[selectedWeekId] = { items: [], completions: {} };
          await save();
        }
        render();
      });
    });
    document.getElementById('prev-month').addEventListener('click', () => {
      viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1); render();
    });
    document.getElementById('next-month').addEventListener('click', () => {
      viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1); render();
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      viewMonth = new Date(); viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);
      selectedWeekId = currentWeekId(); render();
    });

    root.querySelectorAll('[data-action="toggleday"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(btn.disabled) return;
        const id = btn.dataset.id;
        const day = parseInt(btn.dataset.day, 10);
        const rec = data.weeks[selectedWeekId];
        const arr = rec.completions[id] || [];
        rec.completions[id] = arr.includes(day) ? arr.filter(d => d !== day) : [...arr, day].sort();
        render(); await save();
      });
    });

    root.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const rec = data.weeks[selectedWeekId];
        rec.items = rec.items.filter(it => it.id !== id);
        delete rec.completions[id];
        render(); await save();
      });
    });

    root.querySelectorAll('.cat-pill[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        newItemCategory = btn.dataset.cat;
        addingCategory = false;
        render();
        const input = document.getElementById('add-input'); if(input) input.focus();
      });
    });

    const addCatBtn = document.getElementById('add-cat-btn');
    if(addCatBtn){
      addCatBtn.addEventListener('click', () => {
        addingCategory = true; newCatText = ''; render();
        const input = document.getElementById('new-cat-input'); if(input) input.focus();
      });
    }

    async function submitCategory(){
      const catInput = document.getElementById('new-cat-input');
      const val = catInput ? catInput.value.trim() : newCatText.trim();
      if(!val) return;
      const exists = data.categories.find(c => c.toLowerCase() === val.toLowerCase());
      if(!exists) data.categories.push(val);
      newItemCategory = exists || val;
      addingCategory = false;
      newCatText = '';
      render(); await save();
      const input = document.getElementById('add-input'); if(input) input.focus();
    }

    const newCatInput = document.getElementById('new-cat-input');
    if(newCatInput){
      newCatInput.addEventListener('input', () => { newCatText = newCatInput.value; });
      newCatInput.addEventListener('keydown', async (e) => {
        if(e.key === 'Enter') await submitCategory();
        if(e.key === 'Escape'){ addingCategory = false; newCatText=''; render(); }
      });
    }

    const newCatSubmitBtn = document.getElementById('new-cat-submit');
    if(newCatSubmitBtn){ newCatSubmitBtn.addEventListener('click', submitCategory); }

    const copyPrevBtn = document.getElementById('copy-prev-week');
    if(copyPrevBtn){
      copyPrevBtn.addEventListener('click', async () => {
        const sourceId = nearestPriorWeekWithItems(selectedWeekId);
        if(!sourceId) return;
        const sourceItems = data.weeks[sourceId].items;
        const rec = data.weeks[selectedWeekId];
        rec.items = sourceItems.map(it => ({
          id: uid(), text: it.text, category: it.category, target: it.target,
          planDays: itemPlanDays(it), planTime: it.planTime, planDuration: it.planDuration, planLocation: it.planLocation
        }));
        render(); await save();
      });
    }

    const minusBtn = document.getElementById('target-minus');
    if(minusBtn){ minusBtn.addEventListener('click', () => { newItemTarget = Math.max(1, newItemTarget-1); render(); }); }
    const plusBtn = document.getElementById('target-plus');
    if(plusBtn){ plusBtn.addEventListener('click', () => { newItemTarget = Math.min(7, newItemTarget+1); render(); }); }

    root.querySelectorAll('[data-plandaypick]').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.dataset.plandaypick, 10);
        if(newItemPlanDays.includes(val)) newItemPlanDays = newItemPlanDays.filter(d => d !== val);
        else newItemPlanDays = [...newItemPlanDays, val];
        render();
      });
    });

    function updatePlanTime(){
      const h = document.getElementById('plan-hour-select').value;
      const m = document.getElementById('plan-min-select').value;
      newItemPlanTime = (h && m) ? `${h}:${m}` : '';
      render();
    }
    const planHourSelect = document.getElementById('plan-hour-select');
    if(planHourSelect){ planHourSelect.addEventListener('change', updatePlanTime); }
    const planMinSelect = document.getElementById('plan-min-select');
    if(planMinSelect){ planMinSelect.addEventListener('change', updatePlanTime); }

    root.querySelectorAll('[data-plandur]').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.dataset.plandur, 10);
        newItemPlanDuration = (newItemPlanDuration === val) ? null : val;
        render();
      });
    });

    const planLocInput = document.getElementById('plan-loc-input');
    if(planLocInput){
      planLocInput.addEventListener('input', () => { newItemPlanLocation = planLocInput.value; });
    }

    async function submitItem(){
      const input = document.getElementById('add-input');
      const text = input ? input.value.trim() : '';
      if(!text) return;
      const rec = data.weeks[selectedWeekId];
      const finalTarget = newItemPlanDays.length > 0 ? newItemPlanDays.length : newItemTarget;
      rec.items.push({
        id: uid(), text, category: newItemCategory, target: finalTarget,
        planDays: [...newItemPlanDays], planTime: newItemPlanTime || null,
        planDuration: newItemPlanDuration, planLocation: newItemPlanLocation || null
      });
      newItemText = ''; newItemPlanDays = []; newItemPlanTime = ''; newItemPlanDuration = null; newItemPlanLocation = '';
      render(); await save();
      const again = document.getElementById('add-input'); if(again) again.focus();
    }

    const input = document.getElementById('add-input');
    if(input){
      input.addEventListener('input', () => { newItemText = input.value; });
      input.addEventListener('keydown', async (e) => {
        if(e.key === 'Enter') await submitItem();
      });
    }

    const itemSubmitBtn = document.getElementById('item-submit-btn');
    if(itemSubmitBtn){ itemSubmitBtn.addEventListener('click', submitItem); }

    const notifyBtn = document.getElementById('notify-btn');
    if(notifyBtn){
      notifyBtn.addEventListener('click', async () => {
        notifyOn = !notifyOn;
        await storageSet('weekly-notify-pref', notifyOn ? 'on' : 'off');
        if(notifyOn && 'Notification' in window){
          try{
            const perm = await Notification.requestPermission();
            if(perm === 'granted') new Notification('Weekly', { body: 'This is a test of the Sunday recap reminder.' });
          }catch(e){}
        }
        render();
      });
    }

    const savePhoneBtn = document.getElementById('save-phone-btn');
    if(savePhoneBtn){
      savePhoneBtn.addEventListener('click', async () => {
        const phoneInput = document.getElementById('phone-input');
        const val = phoneInput ? phoneInput.value.trim() : '';
        if(!val) return;
        accountabilityPhone = val;
        editingPhone = false;
        await storageSet('weekly-accountability-phone', accountabilityPhone);
        render();
      });
    }

    const editPhoneBtn = document.getElementById('edit-phone-btn');
    if(editPhoneBtn){
      editPhoneBtn.addEventListener('click', () => { editingPhone = true; render(); });
    }

    const genReportBtn = document.getElementById('gen-report-btn');
    if(genReportBtn){
      genReportBtn.addEventListener('click', async () => {
        generatingReport = true;
        render();
        try{
          const text = await generateWeeklyReport(selectedWeekId);
          data.weeks[selectedWeekId].reportText = text || 'Could not generate a report — try again.';
        }catch(e){
          data.weeks[selectedWeekId].reportText = 'Something went wrong generating the report — try again.';
        }
        generatingReport = false;
        render(); await save();
      });
    }

    const markSentBtn = document.getElementById('mark-sent-btn');
    if(markSentBtn){
      markSentBtn.addEventListener('click', async () => {
        data.weeks[selectedWeekId].reportSent = true;
        lockNotice = false;
        render(); await save();
      });
    }
  }

  function bindFocusEvents(){
    const itemSelect = document.getElementById('focus-item-select');
    if(itemSelect){
      itemSelect.addEventListener('change', () => { focusSelectedItemId = itemSelect.value || null; });
    }

    root.querySelectorAll('[data-focusdur]').forEach(btn => {
      btn.addEventListener('click', () => {
        focusDurationMin = parseInt(btn.dataset.focusdur, 10);
        render();
      });
    });

    const startBtn = document.getElementById('start-focus-btn');
    if(startBtn){ startBtn.addEventListener('click', startFocusSession); }

    const stopBtn = document.getElementById('stop-focus-btn');
    if(stopBtn){ stopBtn.addEventListener('click', endFocusSession); }

    if(focusActive){
      const video = document.getElementById('focus-video');
      if(video && focusStream && video.srcObject !== focusStream){
        video.srcObject = focusStream;
        video.play().catch(()=>{});
      }
    }

    const dismissBtn = document.getElementById('focus-dismiss-btn');
    if(dismissBtn){
      dismissBtn.addEventListener('click', () => {
        focusSessionSummary = null;
        focusSelectedItemId = null;
        render();
      });
    }
  }

  load();
})();
</script>
</body>
</html>
